name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

      - name: Upload results.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/results.json

      - name: Publish results to QA dashboard
        if: always()
        run: |
          curl -sf -X POST "https://qa.zanuar.dev/api/results/api-testing-python" \
            -H "Authorization: Bearer ${{ secrets.QA_DASHBOARD_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data @results/results.json \
          || echo "::warning::failed to publish results to qa.zanuar.dev, dashboard may be stale"
